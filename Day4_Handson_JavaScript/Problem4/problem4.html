<!DOCTYPE html>
<html>
<head>
    <title>Traffic Signal Simulator</title>
</head>
<body>

<h2>Traffic Signal Simulator</h2>

<script>

// Store signal color (change this value to test)
let signal = "green";

// Convert to lowercase (optional safety)
signal = signal.toLowerCase();

switch (signal) {

    case "red":
        console.log("Stop");
        break;

    case "yellow":
        console.log("Get Ready");
        break;

    case "green":
        console.log("Go");
        break;

    default:
        console.log("Invalid Signal Color");
}

</script>

</body>
</html>
