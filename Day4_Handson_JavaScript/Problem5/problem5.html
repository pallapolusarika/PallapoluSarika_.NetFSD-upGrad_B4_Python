<!DOCTYPE html>
<html>
<head>
    <title>Number Analysis Tool</title>
</head>
<body>

    <h2>Number Analysis Tool</h2>

    <script>

        let number = 7;   // Change this value to test

        console.log("Given Number:", number);

        // Ternary Operator
        let result = (number >= 0) ? "Positive Number" : "Negative Number";
        console.log(result);

        // If-Else
        if (number % 2 === 0) {
            console.log("Even Number");
        } else {
            console.log("Odd Number");
        }

        // Loop
        console.log("Numbers from 1 to " + number + ":");

        for (let i = 1; i <= number; i++) {
            console.log(i);
        }

    </script>

</body>
</html>
