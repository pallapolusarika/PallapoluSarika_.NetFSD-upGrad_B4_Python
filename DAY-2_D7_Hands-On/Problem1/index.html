<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Analyzer</title>
</head>
<body>

<h2>Student Marks Analyzer</h2>
<div id="output"></div>

<script type="module">


const marks = [80, 70, 60, 90];


const total = marks.reduce((sum, mark) => sum + mark, 0);


const average = total / marks.length;


const grades = marks.map(mark => mark >= 50 ? "Pass" : "Fail");


const result = average >= 50 ? "PASS ✅" : "FAIL ❌";


document.getElementById("output").innerHTML = `
    Marks: ${marks.join(", ")} <br>
    Grades: ${grades.join(", ")} <br>
    Total: ${total} <br>
    Average: ${average.toFixed(2)} <br>
    Final Result: ${result}
`;

</script>

</body>
</html>
